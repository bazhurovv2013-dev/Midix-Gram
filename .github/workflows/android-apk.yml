name: Build Midix Gram Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**','lib/**','package.json','package-lock.json','next.config.ts','capacitor.config.ts','.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.MIDIX_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm install
      - name: Build web app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build unsigned release APK
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Sign release APK
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        working-directory: android/app/build/outputs/apk/release
        env:
          KEYSTORE_BASE64: ${{ secrets.MIDIX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MIDIX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MIDIX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MIDIX_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/midix-release-key.jks"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/zipalign" -v -p 4 app-release-unsigned.apk app-release-aligned.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" sign --ks "$RUNNER_TEMP/midix-release-key.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out Midix-Gram-release.apk app-release-aligned.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose Midix-Gram-release.apk
          rm -f "$RUNNER_TEMP/midix-release-key.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: Midix-Gram-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        with:
          name: Midix-Gram-Android-release
          path: android/app/build/outputs/apk/release/Midix-Gram-release.apk
          if-no-files-found: error
