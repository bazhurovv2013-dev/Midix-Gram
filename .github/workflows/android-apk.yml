name: Build Midix Gram Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**','lib/**','package.json','package-lock.json','next.config.ts','capacitor.config.ts','.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: npm install
      - name: Build web app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - run: npx cap add android
      - run: npx cap sync android
      - name: Configure release-like beta signing
        working-directory: android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          marker = "buildTypes {"
          if marker not in s:
              raise SystemExit("Cannot find Android buildTypes block")
          start = s.index(marker) + len(marker)
          s = s[:start] + "\n        release {\n            signingConfig signingConfigs.debug\n        }" + s[start:]
          p.write_text(s)
          PY
      - name: Build beta APK (release variant, debug signing key)
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Verify beta APK signature
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Midix-Gram-Beta-Release-like
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
